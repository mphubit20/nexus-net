<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดชัวร์ แอปต้นแบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone prototype in the middle, job progress and agreement log beside it. Navy, cobalt and sky blue only. */
:root{
  --navy:#0B1B3F; --cobalt:#1E4FD8; --soft:#5B84E6; --pale:#93AEEF;
  --sky:#E8EFFC; --line:#C9D5EE; --muted:#5B6890; --slate:#46537A;
  --bg:#F4F7FD; --white:#FFFFFF;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--navy)}
:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:300px 410px 300px;gap:32px;justify-content:center;align-items:start}
.side h1{font-size:26px;line-height:1.2;font-weight:700}
.side .sub{color:var(--muted);margin-top:6px;font-size:15px}
.who{display:flex;background:var(--sky);border-radius:14px;padding:4px;margin:18px 0}
.who button{flex:1;padding:10px 8px;border-radius:10px;font-weight:600;font-size:15px;color:var(--slate)}
.who button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
.reset{color:var(--cobalt);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.steps{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:0 0 18px;position:relative;font-size:15px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--pale);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--pale)}
.steps li.done .dot{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.steps li.now .dot{border-color:var(--cobalt);color:var(--cobalt)}
.steps li.now b{color:var(--cobalt)}
.steps small{display:block;color:var(--muted);font-size:13px}
.logbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px}
.logbox h2{font-size:17px;margin-bottom:4px}
.logbox p.hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.logbox ol{list-style:none;display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto}
.logbox li{font-size:14px;border-left:3px solid var(--cobalt);padding-left:10px}
.logbox li time{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.logbox li.empty{border-left-color:var(--line);color:var(--muted)}
/* phone */
.phone{width:390px;height:800px;background:var(--navy);border-radius:54px;padding:10px;box-shadow:0 18px 50px rgba(11,27,63,.22)}
.screen{background:#fff;border-radius:44px;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.status{display:flex;justify-content:space-between;padding:14px 28px 6px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:10px;padding:8px 18px 10px}
.bar h2{font-size:20px;font-weight:700;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;flex:none}
.back svg{width:18px;height:18px}
.body{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.foot{padding:12px 18px 22px;border-top:2px solid var(--sky);background:#fff}
.btn{width:100%;background:var(--cobalt);color:#fff;font-weight:700;font-size:17px;border-radius:16px;padding:15px 12px}
.btn:hover{background:#1a44bd}
.btn[disabled]{background:var(--line);color:var(--slate);cursor:not-allowed}
.btn.ghost{background:var(--sky);color:var(--cobalt)}
.card{background:var(--sky);border-radius:18px;padding:14px 16px}
.card.line{background:#fff;border:2px solid var(--line)}
.card.pick{background:#F3F7FF;border:3px solid var(--cobalt)}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:32px;font-weight:700;color:var(--cobalt);line-height:1.15;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:2px solid var(--sky)}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;background:var(--cobalt);color:#fff;white-space:nowrap}
.pill.out{background:#fff;color:var(--cobalt);border:2px solid var(--cobalt)}
.pill.mute{background:#fff;color:var(--slate);border:2px solid var(--pale)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.field input:focus,.field select:focus{border-color:var(--cobalt);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--pale);border-radius:999px;padding:5px 14px;font-size:15px;color:var(--slate)}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--navy)}
.note svg{flex:none;width:24px;height:24px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;text-align:right;color:var(--navy);padding:6px 4px;border-bottom:3px solid var(--navy)}
.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--muted)}
.tbl td{text-align:right;padding:7px 4px;border-bottom:2px solid var(--sky)}
.tbl tr.tot td{font-weight:700;color:var(--cobalt);border-bottom:0}
.tbl .low{color:var(--muted)}
.tl{display:flex;flex-direction:column}
.tl .it{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .it:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:3px;background:var(--line)}
.tl .ic{width:30px;height:30px;border-radius:50%;flex:none;border:3px solid var(--pale);background:#fff;display:flex;align-items:center;justify-content:center}
.tl .it.ok .ic{background:var(--cobalt);border-color:var(--cobalt)}
.tl .it.ok:not(:last-child)::before{background:var(--cobalt)}
.tl svg{width:16px;height:16px}
.tl b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.tl span{font-size:14px;color:var(--muted)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 20px;color:var(--slate)}
.empty-state h3{color:var(--navy);font-size:20px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--sky);color:var(--cobalt);font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.stats{display:flex;gap:10px}.stats .card{flex:1}
.stats .big{font-size:30px}
.thumb{width:48px;height:48px;border-radius:12px;background:var(--sky);flex:none}
.work{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--sky)}
.num{width:100%;text-align:right}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.qrow input{width:132px;text-align:right}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;display:none}
.toast.on{display:block}
.hintbox{font-size:13px;color:var(--muted)}
@media (max-width:1100px){
  .page{grid-template-columns:410px;gap:20px}
  .side.right{order:3}
}
@media (max-width:430px){
  .page{grid-template-columns:1fr;padding:12px 8px 30px}
  .phone{width:100%;height:760px;border-radius:40px}
  .screen{border-radius:32px}
}
@media (prefers-reduced-motion:no-preference){.body{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="page">
  <aside class="side">
    <h1>จัดชัวร์</h1>
    <p class="sub">แอปต้นแบบ กดใช้ได้ทั้งสองฝั่ง ข้อมูลทุกอย่างเป็นตัวอย่าง</p>
    <div class="who" role="group" aria-label="เลือกมุมมอง">
      <button id="v-client" aria-pressed="true">ลูกค้า (HR)</button>
      <button id="v-org" aria-pressed="false">ออแกไนซ์ A</button>
    </div>
    <p class="hintbox">ลองเริ่มจากฝั่งลูกค้า สร้างโจทย์ แล้วสลับไปฝั่งออแกไนซ์เพื่อเสนอราคา จากนั้นสลับกลับมา</p>
    <ol class="steps" id="steps"></ol>
    <button class="reset" id="reset">เริ่มใหม่ทั้งหมด</button>
  </aside>

  <main>
    <div class="phone"><div class="screen" id="screen"></div></div>
  </main>

  <aside class="side right">
    <div class="logbox">
      <h2>ประวัติข้อตกลง</h2>
      <p class="hint">ทุกการตกลงและการแก้ไขบันทึกวันเวลาไว้ ทั้งสองฝ่ายเห็นเหมือนกัน</p>
      <ol id="log"></ol>
    </div>
  </aside>
</div>

<script>
(function(){
"use strict";
var TYPES={
  "Family Day":{ratio:10},
  "สัมมนาองค์กร":{ratio:25},
  "ปีใหม่องค์กร":{ratio:15},
  "Outing":{ratio:12}
};
var NEEDS=["เวทีและเสียง","อาหาร","กิจกรรม","ทีมงาน"];
var DEFAULT_QUOTE={stage:45000,food:70000,act:50000,team:31000,heads:24,note:"ทีมงาน 24 คน ครบทุกรายการ"};
var OTHERS={
  B:{name:"ออแกไนซ์ B",stage:42000,food:68000,act:48000,team:27000,heads:20,note:"ตัดกิจกรรมเสริมบางส่วน",badge:true},
  C:{name:"ออแกไนซ์ C",stage:45000,food:55000,act:35000,team:15000,heads:12,note:"ตัดอาหารและกิจกรรม",badge:false}
};
var S,role="client",screenId="home";

function fresh(){
  return {stage:0,
    brief:{type:"Family Day",people:200,budget:200000,date:"14 ธ.ค. 2569",needs:{"เวทีและเสียง":true,"อาหาร":true,"กิจกรรม":true,"ทีมงาน":true}},
    quoteA:null, chosen:null, portfolio:[{theme:"Family Day",name:"Family Day บริษัทผลิตอาหาร",budget:180000,people:150,year:2568,app:true},{theme:"ปีใหม่องค์กร",name:"งานเลี้ยงปีใหม่ บริษัทเทคโนโลยี",budget:350000,people:300,year:2568,app:true},{theme:"สัมมนา",name:"สัมมนาประจำปี ฝ่ายขาย",budget:120000,people:80,year:2569,app:true}], log:[], chats:{A:[],B:[],C:[]}, agreed:null, req:{}, chatKey:"A", profKey:"A"};
}
function f(n){return "฿"+Number(n).toLocaleString("en-US");}
function total(q){return q.stage+q.food+q.act+q.team;}
function minTeam(){var b=S.brief;return Math.ceil((Number(b.people)||0)/TYPES[b.type].ratio);}
function deposit(t){return Math.round(t*0.3/5000)*5000;}
function now(){var d=new Date();return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";}
function log(t){S.log.unshift({t:now(),x:t});}
function chosenQ(){return S.chosen==="A"?S.quoteA:(S.chosen?OTHERS[S.chosen]:null);}

var ICON={
  back:'<svg viewBox="0 0 32 32"><path d="M20 6 L10 16 L20 26" fill="none" stroke="#0B1B3F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  shield:'<svg viewBox="0 0 40 40"><path d="M20 3 L34 8.5 V20 C34 28 28 34 20 37.5 C12 34 6 28 6 20 V8.5 Z" fill="#1E4FD8"/><path d="M13 20 L18 25 L27 14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg viewBox="0 0 36 36"><path d="M9 18.5 L15.5 25 L27 12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function bar(title,back){
  return '<div class="status"><span>9:41</span><span>●●●</span></div><div class="bar">'+(back?'<button class="back" data-go="'+back+'" aria-label="กลับ">'+ICON.back+'</button>':'')+'<h2>'+title+'</h2></div>';
}

/* ---------- client screens ---------- */
function cHome(){
  var h=bar("งานของฉัน");
  if(S.stage===0){
    return h+'<div class="empty-state"><h3>ยังไม่มีงาน</h3><p>เขียนโจทย์ให้ชัด ออแกไนซ์จะเสนอราคาจากโจทย์เดียวกัน</p></div><div class="foot"><button class="btn" data-go="brief">สร้างโจทย์งาน</button></div>';
  }
  var b=S.brief,st=stageLabel();
  return h+'<div class="body"><div class="card line" style="cursor:pointer" data-go="'+(S.stage>=3?'cjob':'compare')+'" role="button" tabindex="0"><div class="row" style="border:0;padding:0"><b style="font-size:19px">'+b.type+' · '+b.people+' คน</b><span class="pill">'+st+'</span></div><p class="lbl" style="margin-top:4px">งบ '+f(b.budget)+' · '+b.date+'</p>'+(S.chosen?'<p style="margin-top:8px">'+(S.chosen==="A"?"ออแกไนซ์ A":OTHERS[S.chosen].name)+' · <b>'+f(total(chosenQ()))+'</b></p>':'<p style="margin-top:8px" class="lbl">'+(S.quoteA?'มีใบเสนอราคาให้เทียบแล้ว':'รอใบเสนอราคา')+'</p>')+'</div></div><div class="foot"><button class="btn ghost" data-go="brief">แก้ไขโจทย์</button></div>';
}
function stageLabel(){return ["ยังไม่มีงาน","รอใบเสนอราคา","รอใบเสนอราคา","รอส่งมอบงาน","รอตรวจรับ","จบงานแล้ว"][S.stage];}

function cBrief(){
  var b=S.brief,opts="";
  Object.keys(TYPES).forEach(function(k){opts+='<option'+(k===b.type?' selected':'')+'>'+k+'</option>';});
  var chips="";NEEDS.forEach(function(n){chips+='<button class="chip" data-need="'+n+'" aria-pressed="'+(!!b.needs[n])+'">'+n+'</button>';});
  var editing=S.stage>=1;
  return bar("สร้างโจทย์งาน","home")+'<div class="body">'
   +'<div class="field"><label for="f-type">ประเภทงาน</label><select id="f-type">'+opts+'</select></div>'
   +'<div class="field"><label for="f-people">ผู้เข้าร่วม (คน)</label><input id="f-people" type="number" inputmode="numeric" min="1" value="'+b.people+'"></div>'
   +'<div class="field"><label for="f-budget">งบประมาณ (บาท)</label><input id="f-budget" type="number" inputmode="numeric" min="0" step="1000" value="'+b.budget+'"></div>'
   +'<div class="field"><label for="f-date">วันที่จัดงาน</label><input id="f-date" type="text" value="'+b.date+'"></div>'
   +'<div><div class="lbl" style="margin-bottom:6px">สิ่งที่ต้องการ</div><div class="chips">'+chips+'</div></div>'
   +'<div class="card note">'+ICON.shield+'<p id="mt">ทีมงานขั้นต่ำ <b>'+minTeam()+' คน</b> ระบบกำหนดให้ตามประเภทงาน (เกณฑ์ตัวอย่าง 1 คนต่อ '+TYPES[b.type].ratio+' ผู้ร่วมงาน)</p></div>'
   +'</div><div class="foot"><button class="btn" id="send-brief">'+(editing?'บันทึกโจทย์':'ส่งโจทย์ให้ออแกไนซ์')+'</button></div>';
}

function compareTable(){
  var A=S.quoteA,cols=[["A",A],["B",OTHERS.B],["C",OTHERS.C]];
  function cell(v,k,key){return '<td>'+(v?f(v[key]):'รอ')+'</td>';}
  var rows=[["เวทีและเสียง","stage"],["อาหาร","food"],["กิจกรรม","act"],["ทีมงาน","team"]],t="";
  rows.forEach(function(r){t+='<tr><td>'+r[0]+'</td>'+cols.map(function(c){return cell(c[1],c[0],r[1]);}).join("")+'</tr>';});
  t+='<tr><td>จำนวนทีมงาน</td>'+cols.map(function(c){return '<td>'+(c[1]?c[1].heads+' คน':'รอ')+'</td>';}).join("")+'</tr>';
  t+='<tr class="tot"><td>รวม</td>'+cols.map(function(c){return '<td>'+(c[1]?f(total(c[1])):'รอ')+'</td>';}).join("")+'</tr>';
  return '<table class="tbl"><thead><tr><th></th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>'+t+'</tbody></table>';
}
function qCard(key,q){
  var mt=minTeam(),ok=q.heads>=mt,ag=S.agreed===key;
  var name=oname(key);
  return '<div class="card '+(ag?'pick':'line')+'"><div class="row" style="border:0;padding:0"><b>'+name+'</b><b class="big" style="font-size:24px">'+f(total(q))+'</b></div>'
   +'<p class="lbl" style="margin:2px 0 8px">ทีมงาน '+q.heads+' คน · '+q.note+'</p>'
   +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
   +(key==="A"||q.badge?'<span class="pill out">ตรารับรองจัดชัวร์</span>':'')
   +(ok?'':'<span class="pill mute">ต่ำกว่าเกณฑ์ขั้นต่ำ ('+mt+' คน)</span>')
   +(ag?'<span class="pill">ตกลงดีลแล้ว</span>':'')+'</div>'
   +'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" style="padding:8px;font-size:15px" data-go="cprof" data-prof="'+key+'">ดูโปรไฟล์</button><button class="btn ghost" style="padding:8px;font-size:15px" data-go="cchat" data-chat="'+key+'"'+(ok?'':' disabled')+'>'+(ag?'แชท':'คุยดีล')+'</button></div></div>';
}
function cCompare(){
  var body='<p class="lbl">โจทย์เดียวกัน '+(S.quoteA?3:2)+' เจ้า เทียบรายการต่อรายการ · ทีมงานขั้นต่ำ '+minTeam()+' คน</p>'+'<div class="card line" style="padding:8px 10px">'+compareTable()+'</div>';
  if(!S.quoteA){
    body+='<div class="card note"><p>ออแกไนซ์ A ยังไม่ส่งราคา สลับไปมุมมองออแกไนซ์เพื่อเสนอราคา หรือใช้ราคาตัวอย่างด้านล่าง</p></div><button class="btn ghost" id="demo-quote">ใช้ราคาตัวอย่างของออแกไนซ์ A</button>';
  }else body+=qCard("A",S.quoteA);
  body+=qCard("B",OTHERS.B)+qCard("C",OTHERS.C)+'<p class="hintbox">ดูโปรไฟล์ แชท หรือโทรคุยกับออแกไนซ์ก่อน แล้วขอปิดดีล เมื่อทั้งสองฝ่ายตกลงจึงชำระมัดจำได้</p>';
  return bar("เทียบใบเสนอราคา","home")+'<div class="body">'+body+'</div><div class="foot">'+(S.agreed?'<button class="btn" id="to-pay">ไปอนุมัติและชำระเงิน</button>':'<button class="btn" disabled>คุยและตกลงดีลก่อนจึงชำระได้</button>')+'</div>';
}

function cPay(){
  var q=chosenQ(),t=total(q),d=deposit(t),name=S.chosen==="A"?"ออแกไนซ์ A":q.name;

function render(){
  var map={client:{home:cHome,brief:cBrief,compare:cCompare,pay:cPay,cjob:cJob,cchat:cChat,cprof:cProfile},org:{ohome:oHome,oprofile:oProfile,oquote:oQuote,ojob:oJob,ochat:oChat,oclient:oClient,oadd:oAdd}};
  var fn=map[role][screenId]||(role==="client"?cHome:oHome);
  var el=document.getElementById("screen");
  el.innerHTML=fn()+'<div class="toast" id="toast" role="status"></div>';
  var bd=el.querySelector(".body");if(bd)bd.scrollTop=0;
  steps();logr();
  document.getElementById("v-client").setAttribute("aria-pressed",role==="client");
  document.getElementById("v-org").setAttribute("aria-pressed",role==="org");
}
function toast(m){var t=document.getElementById("toast");if(!t)return;t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast"},2200);}
function steps(){
  var done=[S.stage>=1,!!S.quoteA||S.stage>=3,!!S.agreed||S.stage>=3,S.stage>=3,S.stage>=4,S.stage>=5],labels=[["สร้างโจทย์","ลูกค้าเขียนโจทย์"],["เสนอราคา","แยกรายการ เทียบได้"],["คุยดีล","ดูโปรไฟล์ แชท โทร แล้วปิดดีล"],["ตกลงและชำระมัดจำ","เงินเข้าเงินกลาง"],["ส่งมอบงาน","ออแกไนซ์ส่งมอบ"],["ปล่อยเงิน","ลูกค้าอนุมัติ ชำระงวด 2"]],cur=done.indexOf(false),h="";
  labels.forEach(function(l,i){h+='<li class="'+(done[i]?'done':(i===cur?'now':''))+'"><span class="dot">'+(done[i]?'✓':i+1)+'</span><span><b>'+l[0]+'</b><small>'+l[1]+'</small></span></li>';});
  document.getElementById("steps").innerHTML=h;
}
function logr(){
  var h="";if(!S.log.length)h='<li class="empty">ยังไม่มีรายการ</li>';
  S.log.forEach(function(e){h+='<li><time>'+e.t+'</time>'+e.x+'</li>';});
  document.getElementById("log").innerHTML=h;
}
function go(id){screenId=id;if(id==="oquote")draft=null;render();}

  var t=e.target;
  var ch=t.closest("[data-chat]");if(ch&&!ch.disabled)S.chatKey=ch.getAttribute("data-chat");
  var pf=t.closest("[data-prof]");if(pf)S.profKey=pf.getAttribute("data-prof");
  var dl=t.closest("[data-del]");if(dl){S.portfolio.splice(Number(dl.getAttribute("data-del")),1);render();return;}
  if(t.closest("#save-work")){
    var nm=document.getElementById("a-name").value.trim(),pp=Number(document.getElementById("a-people").value),bg=Number(document.getElementById("a-budget").value);
    if(!nm||!pp||!bg){document.getElementById("a-err").textContent="กรอกชื่องาน จำนวนคน และงบจริงให้ครบ";return;}
    S.portfolio.push({theme:document.getElementById("a-theme").value,name:nm,budget:bg,people:pp,year:Number(document.getElementById("a-year").value)||2568,app:false});
    screenId="oprofile";render();toast("เพิ่มผลงานแล้ว");return;}
  if(t.closest("#to-pay")){S.chosen=S.agreed;go("pay");return;}
  if(t.closest("#req-deal")){var k=S.chatKey;S.req[k]=true;log("ลูกค้าขอปิดดีลกับ"+oname(k)+" ตามที่คุยในแชท");
    if(k!=="A"){S.chats[k].push({f:"o",x:"รับทราบครับ ยืนยันตามที่คุย (ตอบอัตโนมัติ)",t:now().split(" ").slice(-2).join(" ")});S.agreed=k;log(oname(k)+"ยืนยันข้อตกลง");}
    render();return;}
  if(t.closest("#confirm-deal")){S.agreed="A";log("ออแกไนซ์ A ยืนยันข้อตกลงตามที่คุยในแชท");render();toast("ยืนยันข้อตกลงแล้ว");return;}
  var g=t.closest("[data-go]");
  if(g&&!g.disabled){e.preventDefault();go(g.getAttribute("data-go"));return;}
  var n=t.closest("[data-need]");
  if(n){var k=n.getAttribute("data-need");S.brief.needs[k]=!S.brief.needs[k];n.setAttribute("aria-pressed",!!S.brief.needs[k]);return;}
  var p=t.closest("[data-pick]");
  if(p&&!p.disabled){S.chosen=p.getAttribute("data-pick");render();return;}
  if(t.closest("#send-brief")){
    var first=S.stage===0;
    if(first){S.stage=1;log("ลูกค้าส่งโจทย์ "+S.brief.type+" "+S.brief.people+" คน งบ "+f(S.brief.budget)+" ทีมงานขั้นต่ำ "+minTeam()+" คน");}
    else{log("ลูกค้าแก้โจทย์เป็น "+S.brief.type+" "+S.brief.people+" คน งบ "+f(S.brief.budget));}
    screenId="compare";render();return;}
  var qr=t.closest("[data-qr]");
  if(qr){send(screenId==="cchat"?"c":"o",qr.getAttribute("data-qr"));return;}
  if(t.closest("#chat-send")){var i=document.getElementById("chat-in");if(i.value.trim())send(i.getAttribute("data-me"),i.value.trim());return;}
  if(t.closest("#call-btn")){var me=t.closest("#call-btn").getAttribute("data-me");log((me==="c"?"ลูกค้า":"ออแกไนซ์ A")+"โทรคุยรายละเอียด (จำลอง)");S.chats[me==="c"?S.chatKey:"A"].push({f:me,x:"โทรคุยรายละเอียด (จำลอง)",t:now().split(" ").slice(-2).join(" ")});render();toast("จำลองการโทร บันทึกลงประวัติแล้ว");return;}
  if(t.closest("#demo-quote")){S.quoteA=Object.assign({},DEFAULT_QUOTE);log("ออแกไนซ์ A ส่งใบเสนอราคา "+f(total(S.quoteA))+" (ราคาตัวอย่าง)");render();return;}
  if(t.closest("#do-pay")){
    var q=chosenQ(),tt=total(q),d=deposit(tt);S.stage=3;
    log("ลูกค้าอนุมัติ "+(S.chosen==="A"?"ออแกไนซ์ A":q.name)+" ยอด "+f(tt)+" และชำระมัดจำ "+f(d)+" เข้าเงินกลาง");
    screenId="cjob";render();toast("ชำระมัดจำแล้ว บันทึกข้อตกลงเรียบร้อย");return;}
  if(t.closest("#send-quote")){
    S.quoteA=Object.assign({note:"ทีมงาน "+draft.heads+" คน"},draft);S.quoteA.note="ทีมงาน "+draft.heads+" คน";
    log("ออแกไนซ์ A ส่งใบเสนอราคา "+f(total(S.quoteA))+" ทีมงาน "+S.quoteA.heads+" คน");
    screenId="ohome";render();toast("ส่งใบเสนอราคาแล้ว");return;}
  if(t.closest("#deliver")){S.stage=4;log("ออแกไนซ์ A ส่งมอบงาน");render();toast("ส่งมอบงานแล้ว รอลูกค้าตรวจรับ");return;}
  if(t.closest("#approve")){
    var q2=chosenQ(),t2=total(q2),d2=deposit(t2);S.stage=5;
    log("ลูกค้าอนุมัติงานและชำระงวด 2 "+f(t2-d2)+" เงินถึงออแกไนซ์ครบ "+f(t2));
    render();toast("อนุมัติงานแล้ว ปล่อยเงินครบ");return;}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="chat-in"&&e.target.value.trim()){send(e.target.getAttribute("data-me"),e.target.value.trim());return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-go]')){e.preventDefault();go(e.target.getAttribute("data-go"));}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="f-type"){S.brief.type=t.value;upd();}
  else if(t.id==="f-people"){S.brief.people=Number(t.value)||0;upd();}
  else if(t.id==="f-budget"){S.brief.budget=Number(t.value)||0;}
  else if(t.id==="f-date"){S.brief.date=t.value;}
  else if(t.classList.contains("qin")&&draft){
    draft[t.getAttribute("data-k")]=Number(t.value)||0;
    document.getElementById("q-total").textContent=f(total(draft));
    document.getElementById("q-chk").innerHTML=chk(draft);
    document.getElementById("send-quote").disabled=!(draft.heads>=minTeam());
  }
});
function esc(x){return x.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function send(me,x){var key=me==="c"?S.chatKey:"A";S.chats[key].push({f:me,x:esc(x),t:now().split(" ").slice(-2).join(" ")});log((me==="c"?"ลูกค้า":"ออแกไนซ์ A")+"ส่งข้อความในแชท: "+esc(x));if(me==="c"&&key!=="A"){S.chats[key].push({f:"o",x:"รับทราบครับ ปรับตามที่ขอได้ (ตอบอัตโนมัติ)",t:now().split(" ").slice(-2).join(" ")});}render();var b=document.getElementById("chatbody");if(b)b.scrollTop=b.scrollHeight;}
function upd(){var m=document.getElementById("mt");if(m)m.innerHTML='ทีมงานขั้นต่ำ <b>'+minTeam()+' คน</b> ระบบกำหนดให้ตามประเภทงาน (เกณฑ์ตัวอย่าง 1 คนต่อ '+TYPES[S.brief.type].ratio+' ผู้ร่วมงาน)';}
document.getElementById("v-client").addEventListener("click",function(){role="client";screenId="home";render();});
document.getElementById("v-org").addEventListener("click",function(){role="org";screenId="ohome";render();});
document.getElementById("reset").addEventListener("click",function(){S=fresh();draft=null;role="client";screenId="home";render();});

S=fresh();render();
})();
</script>
</body>
</html>
